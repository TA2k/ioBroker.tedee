version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: monthly
      time: '04:00'
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    versioning-strategy: increase
    cooldown:
      default-days: 7
    ignore:
      # @types/node and @tsconfig/node follow the minimum Node.js version in "engines"
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      - dependency-name: '@tsconfig/node*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
      time: '04:00'
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
